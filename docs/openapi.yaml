openapi: 3.0.3
info:
  title: Study Tracker API
  version: 1.1.0
  description: |
    A small REST API for tracking study tasks.
    Task titles are checked with NetEase Yidun text moderation when YIDUN_* credentials are configured.
    Import this file into Apifox or Postman to get ready-made requests.
servers:
  - url: http://localhost:3000
    description: Local development server
security: [] # the API has no authentication yet
tags:
  - name: health
    description: Liveness check
  - name: tasks
    description: Create, read, update and delete study tasks
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Health check
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks, sorted by due date (tasks without one go last)
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: course
          in: query
          description: Case-insensitive course code, e.g. comp2521
          schema: { type: string }
      responses:
        '200':
          description: Matching tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task (title is content-moderated)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTask' }
            examples:
              minimal:
                value: { title: Read lecture 5 notes }
              full:
                value: { title: Finish assignment 2, course: comp2521, dueDate: '2026-11-20' }
      responses:
        '201':
          description: Created. `flagged` is true when moderation marked the title as suspicious.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ContentRejected' }
  /tasks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get one task
      responses:
        '200':
          description: The task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Partially update a task (atomic; a new title is content-moderated)
      description: |
        All fields are validated before any change is applied.
        Send null for course or dueDate to remove it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUpdate' }
            example: { status: done }
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ContentRejected' }
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  schemas:
    TaskStatus:
      type: string
      enum: [todo, in_progress, done]
    Task:
      type: object
      required: [id, title, status]
      properties:
        id: { type: integer, example: 1 }
        title: { type: string, maxLength: 100, example: Read lecture 5 notes }
        course: { type: string, maxLength: 20, example: COMP2521 }
        dueDate: { type: string, format: date, example: '2026-11-20' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        flagged: { type: boolean, description: Present and true only when moderation marked the title as suspicious }
    NewTask:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 100 }
        course: { type: string, maxLength: 20 }
        dueDate: { type: string, format: date }
    TaskUpdate:
      type: object
      minProperties: 1
      properties:
        title: { type: string, maxLength: 100 }
        course: { type: string, maxLength: 20, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        status: { $ref: '#/components/schemas/TaskStatus' }
    Error:
      type: object
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: Invalid id, query or body
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Task not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ContentRejected:
      description: The title was refused by content moderation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
